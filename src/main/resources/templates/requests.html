<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Requests · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a><a th:href="@{/history}">History</a></nav></header><main id="main-content"><h1>Purchase requests</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p class="error" th:if="${error}" th:text="${error}"></p><h2>For your listings</h2><div class="row" th:each="r:${incoming}"><div><b th:text="${r.item.title}"></b><p th:text="'From ' + ${r.buyer.name} + ' · ' + ${r.message}"></p></div><span th:text="${r.status}"></span><form th:if="${r.status.name() == 'PENDING'}" th:action="@{/requests/{id}/accept(id=${r.id})}" method="post"><button>Accept</button></form><form th:if="${r.status.name() == 'PENDING'}" th:action="@{/requests/{id}/reject(id=${r.id})}" method="post"><button class="danger">Reject</button></form></div><p class="empty" th:if="${#lists.isEmpty(incoming)}">No incoming requests.</p><h2>Your requests</h2><div class="row" th:each="r:${outgoing}"><div><b th:text="${r.item.title}"></b><p th:text="'Seller: ' + ${r.item.seller.name}"></p></div><span th:text="${r.status}"></span><form th:if="${r.status.name() == 'PENDING'}" th:action="@{/requests/{id}/cancel(id=${r.id})}" method="post"><button class="danger">Cancel request</button></form></div><p class="empty" th:if="${#lists.isEmpty(outgoing)}">You have not requested any items.</p></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
