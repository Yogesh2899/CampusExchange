<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a><a th:href="@{/requests}">Requests</a></nav></header><main id="main-content" class="narrow"><a th:href="@{/}">← All listings</a><div class="notice" th:if="${notice}" th:text="${notice}"></div><div class="error" th:if="${error}" th:text="${error}"></div><img class="detail-photo" th:if="${photoIds.contains(item.id)}" th:src="@{/photos/{id}(id=${item.id})}" th:alt="${item.title}"><article class="panel"><p class="eyebrow" th:text="${item.category.name} + ' · ' + ${item.condition}"></p><h1 th:text="${item.title}"></h1><h2 th:text="'₹' + ${item.price}"></h2><p th:text="${item.description}"></p><p><b>Seller:</b> <span th:text="${item.seller.name}"></span></p><p><b>Seller rating:</b> <span th:text="${sellerRating}"></span> <span th:text="'(' + ${#lists.size(sellerReviews)} + ' reviews)'"></span></p><p><b>Status:</b> <span th:text="${item.status}"></span></p></article><form class="panel" th:if="${item.status.name() == 'AVAILABLE'}" th:action="@{/items/{id}/request(id=${item.id})}" method="post"><h2>Interested?</h2><label>Message to seller<textarea name="message" maxlength="255" placeholder="When would you like to meet?"></textarea></label><button>Send purchase request</button></form><form class="panel" th:if="${viewerId != null and viewerId == item.seller.id and item.status.name() == 'AVAILABLE'}" th:action="@{/items/{id}/photo(id=${item.id})}" method="post" enctype="multipart/form-data"><h2>Listing photo</h2><p>Upload or replace one JPEG/PNG photo, up to 3 MB.</p><input type="file" name="photo" accept="image/png,image/jpeg" required><button>Save photo</button></form></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
