<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My listings · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a><a th:href="@{/items/new}">Sell an item</a><a th:href="@{/requests}">Requests</a></nav></header><main id="main-content"><h1>My listings</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p class="error" th:if="${error}" th:text="${error}"></p><p>Removing a listing hides it from buyers and rejects pending requests. Sold items stay in your history.</p><div class="row" th:each="item:${items}"><div><a th:href="@{/items/{id}(id=${item.id})}" th:text="${item.title}"></a><p th:text="'₹' + ${item.price} + ' · ' + ${item.status}"></p></div><div class="actions" th:if="${item.status.name() == 'AVAILABLE'}"><a class="button" th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a><form th:action="@{/items/{id}/withdraw(id=${item.id})}" method="post"><button class="danger">Remove listing</button></form></div></div><p class="empty" th:if="${#lists.isEmpty(items)}">You have no listings yet.</p></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
