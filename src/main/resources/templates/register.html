<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"><script th:src="@{/js/password-visibility.js}" defer></script></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a></header><main id="main-content" class="narrow"><form class="panel" th:action="@{/register}" th:object="${form}" method="post"><p class="eyebrow">Join your campus marketplace</p><h1>Create an account</h1><ul class="error" th:if="${#fields.hasAnyErrors()}"><li th:each="e:${#fields.allErrors()}" th:text="${e}"></li></ul><label>Name<input name="name" required maxlength="100" th:value="${form.name}"></label><p class="college-email-note">Use your college email ending in <strong>@thapar.edu</strong>.</p><label>College email<input type="email" name="email" required maxlength="160" th:value="${form.email}"></label><div class="password-field"><label for="register-password">Password</label><div class="password-input"><input id="register-password" type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="password" aria-controls="register-password" aria-label="Show password" aria-pressed="false" title="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></div></div><div class="password-field"><label for="register-confirm-password">Confirm password</label><div class="password-input"><input id="register-confirm-password" type="password" name="confirmPassword" required autocomplete="new-password"><button class="password-toggle" type="button" data-password-toggle="confirm password" aria-controls="register-confirm-password" aria-label="Show confirm password" aria-pressed="false" title="Show confirm password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></div></div><button>Create account</button><p>Already registered? <a th:href="@{/login}">Sign in</a></p></form></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
