<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a></nav></header><main id="main-content" class="narrow"><form class="panel" th:action="@{/items/{id}/edit(id=${item.id})}" method="post"><p class="eyebrow">Give it a new home</p><h1>Edit listing</h1><label>Title<input name="title" th:value="${item.title}" required maxlength="150"></label><label>Category<select name="categoryId" required><option value="">Choose category</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == item.category.id}"></option></select></label><label>Condition<select name="condition" required><option th:each="c:${conditions}" th:value="${c}" th:text="${c}" th:selected="${c == item.condition}"></option></select></label><label>Price (₹)<input name="price" th:value="${item.price}" type="number" min="0.01" step="0.01" required></label><label>Description<textarea name="description" th:text="${item.description}" maxlength="2000" required placeholder="Describe the item and its condition"></textarea></label><p>You can add or replace a photo from the listing details page after saving.</p><button>Save changes</button></form></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
