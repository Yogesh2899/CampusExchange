<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a><a th:href="@{/my-listings}">My listings</a></nav></header><main id="main-content" class="narrow"><form class="panel" th:action="@{/profile}" th:object="${form}" method="post"><h1>My profile</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p>Your contact and campus details are private to your account.</p><p><b>Email:</b> <span th:text="${email}"></span></p><label>Name<input th:field="*{name}" required maxlength="100"><small class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small></label><label>Phone<input th:field="*{phone}" type="tel" required maxlength="30"><small class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small></label><label>Department (optional)<input th:field="*{department}" maxlength="100"><small th:errors="*{department}"></small></label><label>Hostel<input th:field="*{hostel}" required maxlength="100"><small class="error" th:if="${#fields.hasErrors('hostel')}" th:errors="*{hostel}"></small></label><button>Save profile</button></form></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
