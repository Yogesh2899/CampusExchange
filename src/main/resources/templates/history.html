<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History · CampusExchange</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><a class="skip-link" href="#main-content">Skip to content</a><header><a class="brand" th:href="@{/}">Campus<span>Exchange</span></a><nav><a th:href="@{/}">Browse</a><a th:href="@{/requests}">Requests</a></nav></header><main id="main-content"><h1>Trade history</h1><p class="notice" th:if="${notice}" th:text="${notice}"></p><p class="error" th:if="${error}" th:text="${error}"></p><article class="panel" th:each="t:${trades}"><div class="row"><div><b th:text="${t.item.title}"></b><p th:text="'Buyer: ' + ${t.buyer.name} + ' · Seller: ' + ${t.seller.name}"></p></div><strong th:text="'₹' + ${t.finalPrice}"></strong></div><section th:if="${reviewByTrade.containsKey(t.id)}"><h3 th:text="'Rating: ' + ${reviewByTrade.get(t.id).rating} + ' / 5'"></h3><p th:text="${reviewByTrade.get(t.id).comment}"></p></section><form th:if="${t.buyer.id == currentUserId and !reviewByTrade.containsKey(t.id)}" th:action="@{/trades/{id}/review(id=${t.id})}" method="post"><h3>Review your seller</h3><label>Rating<select name="rating" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></label><label>Your review<textarea name="comment" maxlength="500" placeholder="How was your experience?"></textarea></label><button>Publish review</button></form></article><p class="empty" th:if="${#lists.isEmpty(trades)}">No completed trades yet.</p></main><footer><span>CampusExchange</span><p>Reuse more. Spend less. Stay on campus.</p><a href="/">Browse</a> · <a href="/my-listings">My listings</a> · <a href="/profile">Profile</a></footer></body></html>
