<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="440" viewBox="0 0 1300 440" role="img" aria-label="CampusExchange · application architecture"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#6b8e7b"/></marker></defs><rect width="100%" height="100%" fill="#f7faf6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="45" font-size="27" font-weight="750" fill="#234334">CampusExchange · application architecture</text><path d="M250 220H280" fill="none" stroke="#6b8e7b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="13" fill="#335b44" style="paint-order:stroke;stroke:white;stroke-width:5px"></text><path d="M500 220H530" fill="none" stroke="#6b8e7b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="13" fill="#335b44" style="paint-order:stroke;stroke:white;stroke-width:5px"></text><path d="M750 220H780" fill="none" stroke="#6b8e7b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="13" fill="#335b44" style="paint-order:stroke;stroke:white;stroke-width:5px"></text><path d="M1000 220H1030" fill="none" stroke="#6b8e7b" stroke-width="2" marker-end="url(#arrow)"/><text x="0" y="0" font-size="13" fill="#335b44" style="paint-order:stroke;stroke:white;stroke-width:5px"></text><g><rect x="30" y="130" width="220" height="112" rx="12" fill="#fff" stroke="#bfd2c5" stroke-width="2"/><path d="M42 130H238Q250 130 250 142V174H30V142Q30 130 42 130" fill="#1c6048"/><text x="46" y="159" fill="white" font-size="19" font-weight="700">Browser</text><text x="46" y="198" font-size="14" fill="#234334">Student and administrator</text><text x="46" y="222" font-size="14" fill="#234334">HTML forms and PNG photos</text></g><g><rect x="280" y="130" width="220" height="112" rx="12" fill="#fff" stroke="#bfd2c5" stroke-width="2"/><path d="M292 130H488Q500 130 500 142V174H280V142Q280 130 292 130" fill="#1c6048"/><text x="296" y="159" fill="white" font-size="19" font-weight="700">Security + MVC</text><text x="296" y="198" font-size="14" fill="#234334">Session / CSRF / role checks</text><text x="296" y="222" font-size="14" fill="#234334">Controllers and Thymeleaf</text></g><g><rect x="530" y="130" width="220" height="112" rx="12" fill="#fff" stroke="#bfd2c5" stroke-width="2"/><path d="M542 130H738Q750 130 750 142V174H530V142Q530 130 542 130" fill="#1c6048"/><text x="546" y="159" fill="white" font-size="19" font-weight="700">Services</text><text x="546" y="198" font-size="14" fill="#234334">Rules and authorization</text><text x="546" y="222" font-size="14" fill="#234334">Row locks and transactions</text></g><g><rect x="780" y="130" width="220" height="112" rx="12" fill="#fff" stroke="#bfd2c5" stroke-width="2"/><path d="M792 130H988Q1000 130 1000 142V174H780V142Q780 130 792 130" fill="#1c6048"/><text x="796" y="159" fill="white" font-size="19" font-weight="700">Repositories</text><text x="796" y="198" font-size="14" fill="#234334">Spring Data JPA</text><text x="796" y="222" font-size="14" fill="#234334">Hibernate / JDBC</text></g><g><rect x="1030" y="130" width="220" height="112" rx="12" fill="#fff" stroke="#bfd2c5" stroke-width="2"/><path d="M1042 130H1238Q1250 130 1250 142V174H1030V142Q1030 130 1042 130" fill="#1c6048"/><text x="1046" y="159" fill="white" font-size="19" font-weight="700">MySQL</text><text x="1046" y="198" font-size="14" fill="#234334">7 relational tables</text><text x="1046" y="222" font-size="14" fill="#234334">Persistent records and photos</text></g><text x="40" y="355" font-size="16" fill="#3c6550">Request flow: browser → security and controllers → services → repositories → MySQL. HTML responses return to the browser.</text><text x="40" y="390" font-size="16" fill="#3c6550">Sale acceptance is one READ_COMMITTED transaction. Payment and handover remain offline.</text></g></svg>
